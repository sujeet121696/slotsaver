<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlotSaver — Live Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2210%22 width=%2246%22 height=%2246%22 rx=%228%22 fill=%22%232f5fd6%22/><circle cx=%2260%22 cy=%2262%22 r=%2224%22 fill=%22%23e8532b%22/></svg>">
<style>
  :root {
    --bg: #0e1116; --card: #171c24; --line: #262d38; --text: #e6e9ee;
    --dim: #8b94a3;
    --scheduled: #8b94a3; --confirmed: #34c47c; --cancelled: #e5534b;
    --backfilled: #b78bfa; --rescheduled: #58a6ff; --needs_attention: #e3a008;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 28px 36px;
    font-family: "SF Pro Display", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: baseline; justify-content: space-between;
           flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 26px; font-weight: 700; }
  .recovered { text-align: right; }
  .recovered .amount { font-size: 34px; font-weight: 800; color: var(--confirmed);
                       font-variant-numeric: tabular-nums; }
  .recovered .label { color: var(--dim); font-size: 12px; text-transform: uppercase;
                      letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 280px 280px; gap: 20px; }
  /* Pinned explicitly (not by DOM order) so the layout stays stable whether
     or not #controls is hidden for a given visitor. */
  .slots { grid-column: 1; }
  #controls { grid-column: 2; }
  aside.info { grid-column: 3; }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; }
    .slots, #controls, aside.info { grid-column: auto; }
  }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr);
           gap: 14px; align-content: start; }
  @media (max-width: 480px) { .slots { grid-template-columns: 1fr; } }
  .slot { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px 18px; border-left: 5px solid var(--scheduled);
          transition: border-color .4s, transform .4s; }
  .slot .time { font-size: 20px; font-weight: 700; }
  .slot .patient { font-size: 16px; margin-top: 6px; }
  .slot .meta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .pill { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 99px;
          font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
          background: var(--line); }
  .slot.confirmed   { border-left-color: var(--confirmed); }
  .slot.cancelled   { border-left-color: var(--cancelled); opacity: .75; }
  .slot.backfilled  { border-left-color: var(--backfilled);
                      box-shadow: 0 0 18px rgba(183,139,250,.25); }
  .slot.rescheduled { border-left-color: var(--rescheduled); }
  .slot.needs_attention { border-left-color: var(--needs_attention); }
  .slot.confirmed .pill   { color: var(--confirmed); }
  .slot.cancelled .pill   { color: var(--cancelled); }
  .slot.backfilled .pill  { color: var(--backfilled); }
  .slot.rescheduled .pill { color: var(--rescheduled); }
  .slot.needs_attention .pill { color: var(--needs_attention); }
  aside section { background: var(--card); border: 1px solid var(--line);
                  border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
  aside h2 { font-size: 12px; color: var(--dim); text-transform: uppercase;
             letter-spacing: 1px; margin-bottom: 12px; }
  .waitlist li { list-style: none; padding: 6px 0; border-bottom: 1px solid var(--line);
                 font-size: 14px; }
  .waitlist li:last-child { border-bottom: none; }
  .waitlist li::before { content: "☎ "; color: var(--dim); }
  .log { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12px;
         line-height: 1.9; color: var(--dim); }
  .log div:last-child { color: var(--text); }
  .empty { color: var(--dim); font-size: 13px; }
  footer { margin-top: 22px; color: var(--dim); font-size: 12px; }
  #status { color: var(--needs_attention); }
  .call-btn { display: inline-block; margin: 4px 6px 4px 0; padding: 8px 14px;
              border-radius: 8px; border: 1px solid var(--line); background: var(--line);
              color: var(--text); font-size: 13px; cursor: pointer; }
  .call-btn:hover:not(:disabled) { border-color: var(--rescheduled); }
  .call-btn:disabled { opacity: .5; cursor: not-allowed; }
  #callStatus { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .autorun-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
                 font-size: 13px; color: var(--dim); }
  .autorun-toggle { margin-left: 8px; padding: 3px 10px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>
    <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true" style="vertical-align:-5px; margin-right:8px;">
      <rect x="10" y="10" width="46" height="46" rx="8" fill="#2f5fd6"/>
      <circle cx="60" cy="62" r="24" fill="#e8532b"/>
    </svg><span id="clinic">SlotSaver</span></h1>
  <div class="recovered">
    <div class="amount" id="recovered">₹0</div>
    <div class="label">revenue recovered tonight</div>
  </div>
  <button class="call-btn" id="refreshBtn" title="Refresh now instead of waiting for the next poll">⟳ Refresh</button>
</header>
<main>
  <div class="slots" id="slots"></div>
  <aside id="controls" hidden>
    <section id="caller" hidden>
      <h2>Trigger a real call</h2>
      <div id="callButtons"></div>
      <div id="callStatus"></div>
    </section>
    <section id="eveningRun" hidden>
      <h2>Real evening run</h2>
      <button class="call-btn" id="eveningStartBtn">▶ Start real evening run</button>
      <button class="call-btn" id="eveningTestBtn">🧪 Test the flow (no real calls)</button>
      <div id="eveningStatus"></div>
      <div class="autorun-row">
        Automatic daily run (Cron): <strong id="autorunState">…</strong>
        <button class="call-btn autorun-toggle" id="autorunToggleBtn">toggle</button>
      </div>
    </section>
  </aside>
  <aside class="info">
    <section>
      <h2>Waitlist — wants an earlier slot</h2>
      <ul class="waitlist" id="waitlist"></ul>
    </section>
    <section>
      <h2>Asha's call log</h2>
      <div class="log" id="log"><div class="empty">waiting for the evening run…</div></div>
    </section>
  </aside>
</main>
<footer>SlotSaver · an AI front desk that rescues cancelled slots · <span id="status"></span></footer>
<script>
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Shared private-access token: read once from ?key=, stashed in
// localStorage, then scrubbed from the URL bar so it isn't left lying around.
function getPrivateToken() {
  const params = new URLSearchParams(location.search);
  let token = params.get("key");
  if (token) {
    try { localStorage.setItem("slotsaver_token", token); } catch {}
    params.delete("key");
    const clean = location.pathname + (params.toString() ? "?" + params.toString() : "") + location.hash;
    history.replaceState(null, "", clean);
  } else {
    try { token = localStorage.getItem("slotsaver_token"); } catch { token = null; }
  }
  return token || null;
}
const PRIVATE_TOKEN = getPrivateToken();

function render(data) {
  document.getElementById("clinic").textContent = data.clinic;
  document.getElementById("recovered").textContent =
    "₹" + Number(data.recovered_inr || 0).toLocaleString("en-IN");
  document.getElementById("slots").innerHTML = (data.appointments || []).map(a => `
    <div class="slot ${esc(a.status)}">
      <div class="time">${esc(a.time)}</div>
      <div class="patient">${esc(a.patient)}</div>
      <div class="meta">${esc(a.doctor)} · ₹${esc(a.fee_inr)}</div>
      <span class="pill">${esc(a.status).replace("_", " ")}</span>
    </div>`).join("");
  document.getElementById("waitlist").innerHTML =
    (data.waitlist || []).length
      ? data.waitlist.map(w => `<li>${esc(w)}</li>`).join("")
      : '<li class="empty">everyone placed 🎉</li>';
  document.getElementById("log").innerHTML =
    (data.log || []).length
      ? data.log.map(l => `<div>${esc(l)}</div>`).join("")
      : '<div class="empty">waiting for the evening run…</div>';
}

// ---- live mode: poll board.json, falling back to the hosted /api/board
// relay if unlocked with the private token ------------------------------
// A 403 (wrong token) trips the breaker after a few tries; a 404 ("no run
// yet") doesn't — that's a normal wait, and a run can start any moment.
let boardTokenRejected = false;
let boardAuthFailures = 0;
let previewBoard = null; // tonight's cast (names, no calls yet) — fetched once, see initCaller()

/** Returns true if real data was found and rendered, false if still waiting. */
async function refresh() {
  try {
    const res = await fetch("board.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    document.getElementById("status").textContent = "";
    return true;
  } catch { /* fall through to the hosted relay below */ }

  if (PRIVATE_TOKEN && !boardTokenRejected) {
    try {
      const res = await fetch("/api/board?token=" + encodeURIComponent(PRIVATE_TOKEN), { cache: "no-store" });
      if (res.status === 403) {
        boardAuthFailures += 1;
        if (boardAuthFailures >= 3) boardTokenRejected = true;
      } else if (res.ok) {
        boardAuthFailures = 0;
        render(await res.json());
        document.getElementById("status").textContent = "";
        return true;
      }
      // any other status (404 "no run yet", 5xx, ...) — just keep polling
    } catch { /* transient network error — keep polling */ }
  }

  if (previewBoard) {
    render(previewBoard);
    document.getElementById("status").textContent =
      "tonight's schedule — not started yet";
  } else {
    document.getElementById("status").textContent =
      "waiting for board.json — start a run with: python -m slotsaver.run_demo";
  }
  return false;
}

// Polls fast (1s), backing off to 5s after a few idle ticks; a button click
// calls wakeRefreshLoop() to snap back to fast polling immediately.
const FAST_POLL_MS = 1000, SLOW_POLL_MS = 5000, IDLE_TICKS_BEFORE_SLOW = 5;
let idleTicks = 0, refreshTimer = null;

async function refreshLoop() {
  const found = await refresh();
  idleTicks = found ? 0 : idleTicks + 1;
  const delay = idleTicks >= IDLE_TICKS_BEFORE_SLOW ? SLOW_POLL_MS : FAST_POLL_MS;
  refreshTimer = setTimeout(refreshLoop, delay);
}

function wakeRefreshLoop() {
  idleTicks = 0;
  if (refreshTimer) { clearTimeout(refreshTimer); refreshLoop(); }
}

// Manual refresh: forces an immediate poll and snaps back to fast (1s)
// cadence, instead of waiting out the up-to-5s idle backoff.
document.getElementById("refreshBtn").addEventListener("click", wakeRefreshLoop);

// ---- demo mode (?demo=1): self-playing replay of a real agent run ---------
function demoState() {
  return {
    clinic: "Dr. Meera's Dental Clinic",
    recovered_inr: 0,
    appointments: [
      { time: "10:00 AM", patient: "Rohit Sharma", doctor: "Dr. Meera", fee_inr: 800,  status: "scheduled" },
      { time: "11:00 AM", patient: "Priya Nair",   doctor: "Dr. Meera", fee_inr: 800,  status: "scheduled" },
      { time: "12:00 PM", patient: "Imran Khan",   doctor: "Dr. Meera", fee_inr: 1200, status: "scheduled" },
      { time: "4:00 PM",  patient: "Sunita Rao",   doctor: "Dr. Meera", fee_inr: 800,  status: "scheduled" },
    ],
    waitlist: ["Kavya Menon", "Arjun Das"],
    log: [],
  };
}

// Mirrors an actual Strands-agent evening run (it even backfills the
// rescheduled slot — ₹1,600 recovered vs the script's ₹800).
const DEMO_STEPS = [
  s => s.log.push("7:00 PM — Asha starts tonight's confirmation round…"),
  s => { s.log.push("Confirm call → Rohit Sharma confirmed 10:00 AM"); s.appointments[0].status = "confirmed"; },
  s => { s.log.push("Confirm call → Priya Nair cancelled 11:00 AM"); s.appointments[1].status = "cancelled"; },
  s => s.log.push("Backfill call → Kavya Menon declined the 11:00 AM slot"),
  s => {
    s.log.push("Backfill call → Arjun Das accepted the 11:00 AM slot");
    s.log.push("Slot 11:00 AM refilled — ₹800 recovered");
    Object.assign(s.appointments[1], { status: "backfilled", patient: "Arjun Das" });
    s.waitlist = s.waitlist.filter(w => w !== "Arjun Das");
    s.recovered_inr += 800;
  },
  s => s.log.push("Confirm call → Imran Khan did not answer"),
  s => { s.log.push("Retry call → Imran Khan confirmed 12:00 PM"); s.appointments[2].status = "confirmed"; },
  s => {
    s.log.push("Confirm call → Sunita Rao asked to reschedule 4:00 PM");
    s.log.push("Sunita Rao moved to a future slot; 4:00 PM freed");
    s.appointments[3].status = "rescheduled";
  },
  s => {
    s.log.push("Backfill call → Kavya Menon accepted the 4:00 PM slot");
    s.log.push("Slot 4:00 PM refilled — ₹800 recovered");
    Object.assign(s.appointments[3], { status: "backfilled", patient: "Kavya Menon" });
    s.waitlist = s.waitlist.filter(w => w !== "Kavya Menon");
    s.recovered_inr += 800;
  },
  s => s.log.push("Morning report: 2 confirmed · 1 cancelled · 2 backfilled · ₹1,600 recovered"),
];

function runDemo() {
  document.getElementById("status").textContent =
    "self-playing replay of the agent's evening run — see the demo video for the real phone calls";
  let state = demoState(), i = 0;
  render(state);
  setInterval(() => {
    if (i < DEMO_STEPS.length) {
      DEMO_STEPS[i++](state);
    } else if (i++ > DEMO_STEPS.length + 2) {   // hold the final board ~7s
      state = demoState(); i = 0;
    }
    render(state);
  }, 2200);
}

if (new URLSearchParams(location.search).has("demo")) runDemo();
else { refreshLoop(); }

// ---- private call trigger ---------------------------------------------
// Token-gated: real phone numbers never reach the browser, only masked
// labels + an opaque id. Silently does nothing without a valid token, so
// the page looks identical to any other visitor. Also never runs in
// ?demo=1 — that mode is a safe, scripted showcase, even if a token is
// remembered in this browser from an earlier private visit.
(async function initCaller() {
  if (new URLSearchParams(location.search).has("demo")) return;
  const token = PRIVATE_TOKEN;
  if (!token) return;

  let numbers;
  try {
    const res = await fetch("/api/numbers?token=" + encodeURIComponent(token));
    if (!res.ok) return; // bad/expired token — stay silent
    ({ numbers } = await res.json());
  } catch { return; }
  if (!numbers || !numbers.length) return;

  const section = document.getElementById("caller");
  const btnWrap = document.getElementById("callButtons");
  const statusEl = document.getElementById("callStatus");
  document.getElementById("controls").hidden = false; // the shared 3rd-column wrapper
  section.hidden = false;
  btnWrap.innerHTML = numbers.map(n =>
    `<button class="call-btn" data-id="${n.id}">📞 Call ${esc(n.label)}</button>`
  ).join("") +
    `<button class="call-btn" data-id="${numbers[0].id}" data-dry-run="1">` +
    `🧪 Test the flow (no real call, no credit spent)</button>`;
  btnWrap.querySelectorAll(".call-btn").forEach(btn =>
    btn.addEventListener("click", () => placeCall(btn, token, statusEl)));

  initEveningRun(token); // same validated token — reveal the evening-run controls too

  // Fetch tonight's cast once so the board shows real scheduled names
  // instead of a blank page while nothing has actually started yet.
  try {
    const res = await fetch("/api/evening/preview?token=" + encodeURIComponent(token));
    if (res.ok) previewBoard = (await res.json()).board;
  } catch { /* no preview — refresh() just shows the waiting message */ }
  wakeRefreshLoop(); // re-render now that a preview may be available

  async function placeCall(btn, token, statusEl) {
    const dryRun = btn.dataset.dryRun === "1";
    btn.disabled = true;
    statusEl.textContent = dryRun ? "Placing test call (simulated)…" : "Placing call…";
    try {
      const res = await fetch("/api/call", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: Number(btn.dataset.id), token, dryRun }),
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Error: " + (data.error || res.status);
        btn.disabled = false;
        return;
      }
      statusEl.textContent = dryRun ? "Simulating…" : "Calling — answer your phone…";
      await pollCall(data.call_id, token, statusEl);
    } catch {
      statusEl.textContent = "Network error placing the call.";
    }
    // Real calls: matches the server's 60s cooldown. Dry runs aren't
    // rate-limited server-side, so re-enable almost immediately.
    setTimeout(() => { btn.disabled = false; }, dryRun ? 500 : 60000);
  }

  async function pollCall(callId, token, statusEl) {
    for (let i = 0; i < 150; i++) { // up to ~5 min at 2s intervals
      await new Promise(r => setTimeout(r, 2000));
      let data;
      try {
        const res = await fetch(`/api/call?id=${encodeURIComponent(callId)}&token=${encodeURIComponent(token)}`);
        data = await res.json();
      } catch { continue; }
      if (data.terminal) {
        statusEl.textContent = data.outcome
          ? `Result: ${data.outcome}${data.notes ? " — " + data.notes : ""}`
          : `Call ended (${data.status})`;
        return;
      }
      statusEl.textContent = `Status: ${data.status || "in progress"}…`;
    }
    statusEl.textContent = "Timed out waiting for the call result.";
  }
})();

// ---- real evening run (manual trigger) ---------------------------------
// Drives /api/evening/step repeatedly until done — the manual equivalent
// of the Cron Trigger (wrangler.jsonc); both share the same board via
// /api/board.
function initEveningRun(token) {
  const section = document.getElementById("eveningRun");
  const statusEl = document.getElementById("eveningStatus");
  const startBtn = document.getElementById("eveningStartBtn");
  const testBtn = document.getElementById("eveningTestBtn");
  const autorunState = document.getElementById("autorunState");
  const autorunToggleBtn = document.getElementById("autorunToggleBtn");
  section.hidden = false;

  let running = false;

  async function refreshAutorunLabel() {
    try {
      const res = await fetch("/api/evening/autorun?token=" + encodeURIComponent(token));
      const data = await res.json();
      autorunState.textContent = data.enabled ? "ON" : "OFF";
      autorunToggleBtn.textContent = data.enabled ? "turn off" : "turn on";
    } catch {
      autorunState.textContent = "unknown";
    }
  }
  refreshAutorunLabel();

  autorunToggleBtn.addEventListener("click", async () => {
    autorunToggleBtn.disabled = true;
    const turningOn = autorunToggleBtn.textContent === "turn on";
    try {
      await fetch("/api/evening/autorun", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, enabled: turningOn }),
      });
    } catch { /* refreshAutorunLabel below will reflect whatever actually stuck */ }
    await refreshAutorunLabel();
    autorunToggleBtn.disabled = false;
  });

  async function run(dryRun) {
    if (running) return;
    running = true;
    startBtn.disabled = true;
    testBtn.disabled = true;
    statusEl.textContent = dryRun ? "Starting simulated evening run…" : "Starting real evening run…";
    try {
      const startRes = await fetch("/api/evening/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, dryRun }),
      });
      const startData = await startRes.json();
      if (!startRes.ok) {
        statusEl.textContent = "Error: " + (startData.error || startRes.status);
        running = false;
        startBtn.disabled = false;
        testBtn.disabled = false;
        return;
      }
      wakeRefreshLoop(); // show progress at 1s cadence, not up to 5s stale
      await stepLoop();
    } catch {
      statusEl.textContent = "Network error starting the run.";
      running = false;
      startBtn.disabled = false;
      testBtn.disabled = false;
    }
  }

  async function stepLoop() {
    for (let i = 0; i < 300; i++) { // generous ceiling; a real run finishes well before this
      let data;
      try {
        const res = await fetch("/api/evening/step", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "Error: " + (data.error || res.status);
          break;
        }
      } catch {
        statusEl.textContent = "Network error during the run — retrying…";
        await new Promise(r => setTimeout(r, 3000));
        continue;
      }
      if (data.done) {
        statusEl.textContent = "Evening run complete — see the board and log above.";
        break;
      }
      statusEl.textContent = data.busy ? "Advancing…" : "Evening run in progress — see the board above.";
      await new Promise(r => setTimeout(r, 3000));
    }
    running = false;
    startBtn.disabled = false;
    testBtn.disabled = false;
  }

  startBtn.addEventListener("click", () => run(false));
  testBtn.addEventListener("click", () => run(true));
}
</script>
</body>
</html>
